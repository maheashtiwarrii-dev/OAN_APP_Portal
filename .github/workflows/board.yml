# Publishes the Kanban delivery board, the status report and the APEX page catalogue to GitHub Pages (not the rest of the repo).
name: Delivery board

on:
  push:
    branches: [main]
    paths:
      - docs/delivery-board.html
      - docs/OAN-Delivery-Board-landscape.pdf
      - docs/status-report.html
      - docs/OAN-Project-Status-Report.pdf
      - docs/apex-page-catalogue.html
      - docs/OAN-APEX-Page-Catalogue.pdf
      - docs/index.html
      - .github/workflows/board.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p site
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1"></head><body>'
            cat docs/delivery-board.html
            echo '</body></html>'
          } > site/delivery-board.html
          cp docs/index.html docs/status-report.html docs/apex-page-catalogue.html site/
          cp docs/OAN-Delivery-Board-landscape.pdf docs/OAN-Project-Status-Report.pdf docs/OAN-APEX-Page-Catalogue.pdf site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
